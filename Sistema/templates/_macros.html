{% macro icone(nome) -%}
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if nome == 'painel' -%}<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>
{%- elif nome == 'caixa' -%}<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>
{%- elif nome == 'globo' -%}<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"/>
{%- elif nome == 'livro' -%}<path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/>
{%- elif nome == 'grade' -%}<rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>
{%- elif nome == 'rede' -%}<circle cx="5" cy="6" r="2.5"/><circle cx="19" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7.5 6h9M6.3 8.2l4.4 7.6M17.7 8.2l-4.4 7.6"/>
{%- elif nome == 'lapis' -%}<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>
{%- elif nome == 'alvo' -%}<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>
{%- elif nome == 'info' -%}<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/>
{%- elif nome == 'elo' -%}<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>
{%- elif nome == 'download' -%}<path d="M12 4v11M7 10l5 5 5-5"/><path d="M4 19h16"/>
{%- elif nome == 'menu' -%}<path d="M4 6h16M4 12h16M4 18h16"/>
{%- endif -%}
</svg>
{%- endmacro %}

{% macro caso(nome) -%}
<span class="caso" style="--c: {{ CASOS[nome].cor if nome in CASOS else '#8a939b' }}" title="{{ CASOS[nome].definicao if nome in CASOS }}">{{ CASOS[nome].rotulo if nome in CASOS else nome }}</span>
{%- endmacro %}

{% macro pais(nome) -%}
{%- set iso = CODIGO_DO_PAIS.get(nome) -%}
{%- if iso -%}<a href="{{ url_for('pais', iso=iso) }}">{{ nome }}</a>{%- else -%}{{ nome }}{%- endif -%}
{%- endmacro %}
